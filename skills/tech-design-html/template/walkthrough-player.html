<script type="application/octet-stream" id="walkAudio">__AUDIO_B64__</script>
<script>
/* ---------- optional audio walkthrough ----------
   Nothing loads or plays until the reader opens it. Strict hosts block <audio> with data: URLs, so the embedded MP3 is
   decoded with Web Audio. Speeds other than 1x play a time-stretched copy (WSOLA) so the voice keeps its pitch. */
(() => {
  const CHAPTERS = __CHAPTERS__;
  const DURATION = __DURATION__;
  const $ = id => document.getElementById(id);
  const bar = $('walkbar'), btnOpen = $('walkOpen');
  const fmt = t => { t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  let ctx = null, buf = null, loading = null, src = null, startedAt = 0, offset = 0, rate = 1, playing = false, tick = null;
  const stretched = new Map();
  const ac = () => (ctx ||= new (window.AudioContext || window.webkitAudioContext)());

  function load() {
    return (loading ||= (async () => {
      setStatus('Loading audio…');
      const b64 = $('walkAudio').textContent.trim();
      const bin = atob(b64), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      buf = await ac().decodeAudioData(bytes.buffer);
      stretched.set(1, buf); setStatus('');
    })());
  }
  // Waveform-similarity overlap-add: changes duration by 1/r without changing pitch. Yields to keep the page responsive.
  async function stretch(r) {
    const sr = buf.sampleRate, x = buf.getChannelData(0), n = x.length;
    const N = Math.round(sr * 0.04) & ~1, Hs = N / 2, Ha = Hs * r, tol = Math.round(sr * 0.012);
    const win = new Float32Array(N); for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / N);
    const outLen = Math.ceil(n / r) + N, y = new Float32Array(outLen), w = new Float32Array(outLen);
    let prev = 0;
    for (let k = 0; ; k++) {
      const nominal = Math.round(k * Ha);
      if (nominal + N + tol >= n) break;
      let pos = nominal;
      if (k > 0) {
        const nat = prev + Hs; let best = -Infinity, bestD = 0;
        const corr = d => { let s = 0; const p = nominal + d; for (let i = 0; i < N; i += 4) s += x[p + i] * x[nat + i]; return s; };
        const lo = Math.max(-tol, -nominal), hi = tol;
        for (let d = lo; d <= hi; d += 3) { const c = corr(d); if (c > best) { best = c; bestD = d; } }
        for (let d = bestD - 2; d <= bestD + 2; d++) { if (d < lo || d > hi) continue; const c = corr(d); if (c > best) { best = c; bestD = d; } }
        pos = nominal + bestD;
      }
      const o = k * Hs;
      for (let i = 0; i < N; i++) { y[o + i] += x[pos + i] * win[i]; w[o + i] += win[i]; }
      prev = pos;
      if (k % 1500 === 1499) await new Promise(res => setTimeout(res, 0));
    }
    for (let i = 0; i < outLen; i++) if (w[i] > 1e-3) y[i] /= w[i];
    const out = ac().createBuffer(1, outLen, sr); out.getChannelData(0).set(y); return out;
  }
  const bufferFor = r => { if (!stretched.has(r)) stretched.set(r, stretch(r)); return Promise.resolve(stretched.get(r)); };

  const now = () => playing ? Math.min(DURATION, offset + (ac().currentTime - startedAt) * rate) : offset;
  async function start() {
    const b = await bufferFor(rate);
    stopSrc();
    const s = ac().createBufferSource(); s.buffer = b; s.connect(ac().destination);
    s.onended = () => { if (src !== s) return; src = null; playing = false; offset = DURATION; render(); };
    startedAt = ac().currentTime; s.start(0, Math.min(offset / rate, Math.max(0, b.duration - 0.05))); src = s;
  }
  function stopSrc() { if (src) { const s = src; src = null; try { s.stop(); } catch {} } }
  async function play() {
    await ac().resume(); await load();
    if (offset >= DURATION - 0.2) offset = 0;
    playing = true; await start(); render();
    clearInterval(tick); tick = setInterval(render, 250);
  }
  function pause() { offset = now(); playing = false; stopSrc(); clearInterval(tick); render(); }
  async function seek(t) { offset = Math.max(0, Math.min(DURATION, t)); if (playing) await start(); render(); }
  async function setRate(r) {
    if (r === rate) return;
    if (buf && !(stretched.get(r) instanceof AudioBuffer)) setStatus('Preparing ' + r + '× (pitch kept)…');
    if (buf) { const b = await bufferFor(r); stretched.set(r, b); }
    if (+$('wbRate').value !== r) return;
    const t = now(); rate = r; offset = t; if (playing) await start(); setStatus(''); render();
  }
  function setStatus(t) { $('wbStatus').textContent = t; }

  const chapterAt = t => { let i = 0; for (let k = 0; k < CHAPTERS.length; k++) if (t >= CHAPTERS[k][0] - 0.05) i = k; return i; };
  let lastChap = -1;
  function render() {
    const t = now(), i = chapterAt(t);
    $('wbTime').textContent = fmt(t) + ' / ' + fmt(DURATION);
    if (document.activeElement !== $('wbSeek')) $('wbSeek').value = Math.round((t / DURATION) * 1000);
    $('wbChap').textContent = CHAPTERS[i][1];
    $('wbIco').innerHTML = playing ? '<path d="M3 1.5h3v11H3zM8 1.5h3v11H8z"/>' : '<path d="M3 1.5v11l9.5-5.5z"/>';
    $('wbPlay').setAttribute('aria-label', playing ? 'Pause' : 'Play');
    $('wbList').querySelectorAll('button').forEach((b, k) => b.classList.toggle('on', k === i));
    if (i !== lastChap) { if (lastChap !== -1 && playing && $('wbFollow').checked) goTo(i); lastChap = i; }
  }
  const goTo = i => { const el = document.getElementById(CHAPTERS[i][2]); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };

  // chapter ticks and list
  CHAPTERS.forEach(([t, title, id], i) => {
    if (i) { const d = document.createElement('div'); d.className = 'wb-tick'; d.style.left = (t / DURATION) * 100 + '%'; $('wbTrack').appendChild(d); }
    const li = document.createElement('li'), b = document.createElement('button');
    b.innerHTML = '<span class="t">' + fmt(t) + '</span><span></span>'; b.lastChild.textContent = title;
    b.onclick = () => { seek(t); goTo(i); if (!playing) play(); toggleList(false); };
    li.appendChild(b); $('wbList').appendChild(li);
  });
  const toggleList = open => { $('wbList').hidden = !open; $('wbChap').setAttribute('aria-expanded', String(open)); };

  btnOpen.onclick = () => { bar.hidden = false; render(); $('wbPlay').focus(); };
  $('wbClose').onclick = () => { pause(); toggleList(false); bar.hidden = true; };
  $('wbPlay').onclick = () => (playing ? pause() : play());
  $('wbBack').onclick = () => seek(now() - 15);
  $('wbFwd').onclick = () => seek(now() + 15);
  $('wbChap').onclick = () => toggleList($('wbList').hidden);
  $('wbSeek').oninput = e => { $('wbTime').textContent = fmt((e.target.value / 1000) * DURATION) + ' / ' + fmt(DURATION); };
  $('wbSeek').onchange = e => seek((e.target.value / 1000) * DURATION);
  $('wbRate').onchange = e => setRate(+e.target.value);
  window.__walk = { now, get playing() { return playing; }, get rate() { return rate; }, stretched, chapters: CHAPTERS, duration: DURATION };  // read by check_walkthrough.mjs
})();
</script>
